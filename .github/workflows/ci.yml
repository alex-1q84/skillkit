# CI 与本地同一套规则（Makefile 注释约定）：check 与本地 make check 完全一致。
# runner 用 macOS：core 大量 symlink / home 目录逻辑，与开发机同平台最保真。
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # release job 创建 Release 需要

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/') == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make check（format + lint + test）
        run: make check

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 release 二进制
        run: cargo build --release -p skillkit-cli
      - name: 打包 tarball（二进制 + LICENSE + README）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="skillkit-${VERSION}-aarch64-apple-darwin"
          mkdir -p "dist/${ARTIFACT}"
          cp target/release/skillkit LICENSE README.md "dist/${ARTIFACT}/"
          tar -czf "dist/${ARTIFACT}.tar.gz" -C dist "${ARTIFACT}"
          shasum -a 256 "dist/${ARTIFACT}.tar.gz" | tee dist/sha256.txt
      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz dist/sha256.txt
