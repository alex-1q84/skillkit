# CI 与本地同一套规则（Makefile 注释约定）：check 与本地 make check 完全一致。
# runner 用 macOS：core 大量 symlink / home 目录逻辑，与开发机同平台最保真。
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # release job 创建 Release 需要

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/') == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: make check（format + toolchain + lint + test）
        shell: bash
        # 失败时把错误行写进 ::error 注解（annotations API 匿名可读），无 logs 权限也能取证
        run: |
          if ! make check > /tmp/check.log 2>&1; then
            grep -E "error(\[|:)|FAILED|failures:|panicked|Update available" /tmp/check.log | head -15 | tr '\n' '|' > /tmp/err.txt || true
            echo "::error title=make check 失败::$(< /tmp/err.txt)"
            tail -30 /tmp/check.log
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    env:
      # 对 homebrew-tap 有写权限的 PAT；steps.if 里引用不了 secrets 上下文，故提到 job 级 env 判断
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 release 二进制
        run: cargo build --release -p skillkit-cli
      - name: 打包 tarball（二进制 + LICENSE + README）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="skillkit-${VERSION}-aarch64-apple-darwin"
          mkdir -p "dist/${ARTIFACT}"
          cp target/release/skillkit LICENSE README.md "dist/${ARTIFACT}/"
          tar -czf "dist/${ARTIFACT}.tar.gz" -C dist "${ARTIFACT}"
          shasum -a 256 "dist/${ARTIFACT}.tar.gz" | tee dist/sha256.txt
      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz dist/sha256.txt
      # 把新版本 + sha256 写入 alex-1q84/homebrew-tap，用户 brew upgrade 即可拿到新版
      - name: 更新 Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(awk '{print $1}' dist/sha256.txt)
          git clone -q https://x-access-token:${TAP_TOKEN}@github.com/alex-1q84/homebrew-tap.git tap-repo
          mkdir -p tap-repo/Formula
          cat > tap-repo/Formula/skillkit.rb <<EOF
          class Skillkit < Formula
            desc "AI agent skill 统一管理工具"
            homepage "https://github.com/alex-1q84/skillkit"
            version "${VERSION}"
            license "MIT"

            # CI 只产出 aarch64-apple-darwin 二进制，其余平台暂不提供
            depends_on :macos
            depends_on arch: :arm64

            url "https://github.com/alex-1q84/skillkit/releases/download/v${VERSION}/skillkit-${VERSION}-aarch64-apple-darwin.tar.gz"
            sha256 "${SHA}"

            def install
              bin.install "skillkit"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/skillkit --version")
            end
          end
          EOF
          cd tap-repo
          git add Formula/skillkit.rb
          if git diff --cached --quiet; then
            echo "formula 无变化，跳过"
          else
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "skillkit ${GITHUB_REF_NAME}"
            git push -q origin main
          fi
