[workspace]
members = ["crates/core", "crates/cli", "crates/server"]
resolver = "2"

# 各 crate 共享元数据，crate 内用 xxx.workspace = true 继承（避免三处重复维护）
[workspace.package]
license = "MIT"
repository = "https://github.com/alex-1q84/skillkit"

# workspace 级 clippy lints（对标 Java 的 Error Prone / NullAway 静态检查）。
# 各 crate 的 Cargo.toml 用 [lints] workspace = true 继承。
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# CLI / 业务场景常见噪音，按需 allow（避免首次 -D warnings 卡在风格上）
needless_pass_by_value = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
