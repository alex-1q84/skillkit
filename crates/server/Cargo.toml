[package]
name = "skillkit-server"
version = "0.1.1"
edition = "2021"
description = "Local web GUI server of skillkit for browsing and configuring AI agent skills"
license.workspace = true
repository.workspace = true

[dependencies]
skillkit-core = { path = "../core" }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
rust-embed = "8"
uuid = { version = "1", features = ["v4"] }
askama = "0.13"
form_urlencoded = "1"
dirs = "5"
notify = "8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
zip = "2"

[lints]
workspace = true
