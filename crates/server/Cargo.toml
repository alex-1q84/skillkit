[package]
name = "skillkit-server"
version = "0.1.0"
edition = "2021"

[dependencies]
skillkit-core = { path = "../core" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
rust-embed = "8"
uuid = { version = "1", features = ["v4"] }
askama = "0.13"
form_urlencoded = "1"
dirs = "5"
notify = "8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
