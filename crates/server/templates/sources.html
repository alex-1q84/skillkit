{% extends "layout.html" %}
{% block content %}
<h1>Sources</h1>
<form class="row" hx-post="/{{ token }}/sources" hx-target="body" hx-swap="outerHTML">
  <input name="name" placeholder="name" required>
  <input name="package" placeholder="package（git url / local path / owner-repo；省略=skills.sh）">
  <button>add</button>
</form>
<table class="data">
  <thead><tr><th>name</th><th>package</th><th>ops</th></tr></thead>
  <tbody>
  {% for s in sources %}
  <tr>
    <td>{{ s.name }}</td>
    <td>{{ s.package.as_deref().unwrap_or("（registry 搜索入口）") }}</td>
    <td><button class="x" hx-delete="/{{ token }}/sources/{{ s.name }}" hx-target="body" hx-swap="outerHTML">×</button></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
