{% extends "layout.html" %}
{% block content %}
<h1>Skills</h1>
<table class="data">
  <thead><tr><th>id</th><th>scope</th><th>source</th><th>version</th><th>commit_sha</th></tr></thead>
  <tbody>
  {% for s in skills %}
  <tr>
    <td>{{ s.id }}</td>
    <td>{{ s.scope }}</td>
    <td>{{ s.source }}</td>
    <td>{{ s.version.as_deref().unwrap_or("-") }}</td>
    <td>{{ s.commit_sha.as_deref().unwrap_or("-") }}</td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
