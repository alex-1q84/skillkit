<div class="browse-overlay scan-flyout">
  <div class="browse-modal" role="dialog" aria-label="扫描发现的项目">
    <header class="browse-header">
      <span class="browse-cwd">扫描发现（{{ candidates.len() }} 个项目）</span>
      <button type="button" class="browse-close" aria-label="关闭">✕</button>
    </header>
    <div class="browse-body">
      {% if candidates.is_empty() %}
      <p class="err browse-empty">未发现含 .git 的项目目录</p>
      {% else %}
      <table class="data">
        <thead><tr><th>项目目录</th><th>ops</th></tr></thead>
        <tbody>
        {% for c in &candidates %}
        <tr>
          <td>{{ c.path }}</td>
          <td>
            <form class="inline scan-toggle-form" hx-post="/{{ token }}/projects/toggle" hx-swap="outerHTML">
              <input type="hidden" name="path" value="{{ c.path }}">
              <button class="scan-toggle-btn {% if c.registered %}registered{% endif %}">{% if c.registered %}已注册 ✓{% else %}注册{% endif %}</button>
            </form>
          </td>
        </tr>
        {% endfor %}
        </tbody>
      </table>
      {% endif %}
    </div>
  </div>
</div>
