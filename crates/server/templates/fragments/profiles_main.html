<h1>Profiles</h1>
<form hx-post="/{{ token }}/profiles" hx-target="body" hx-swap="outerHTML">
  <input name="name" placeholder="新 profile 名" required>
  <button>create</button>
</form>
{% for profile in profiles %}
<section class="card">
  <h2>{{ profile.name }}</h2>
  <p>{{ profile.description }}</p>
  <form hx-post="/{{ token }}/profiles/{{ profile.name }}/skills" hx-target="#skills-{{ profile.name }}" hx-swap="outerHTML">
    <input name="id" placeholder="source/skill" required>
    <button>add</button>
  </form>
  <div id="skills-{{ profile.name }}">
    {% include "fragments/profile_skills.html" %}
  </div>
</section>
{% endfor %}
