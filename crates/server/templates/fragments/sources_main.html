<h1>Sources</h1>
<form class="row source-add" hx-post="/{{ token }}/sources" hx-target="body" hx-swap="outerHTML">
  <input class="src-package" name="package" placeholder="package：GitHub owner/repo · git url · 本地路径"
         required
         hx-get="/{{ token }}/sources/preview" hx-trigger="input changed delay:300ms" hx-include="this" hx-target="#src-name-wrap" hx-swap="innerHTML"
         data-trigger="input changed delay:300ms">
  <span id="src-name-wrap">
    <input class="src-name" id="src-name" name="name" placeholder="name（留空自动推导）"
           oninput="var p=this.form.querySelector('.src-package'); if(this.value){p.removeAttribute('hx-trigger')}else{p.setAttribute('hx-trigger', p.dataset.trigger)}">
  </span>
  <button>add</button>
</form>
<table class="data">
  <thead><tr><th>name</th><th>package</th><th>ops</th></tr></thead>
  <tbody>
  {% for s in sources %}
  <tr>
    <td>{{ s.name }}</td>
    <td>{{ s.package.as_deref().unwrap_or("（registry 搜索入口）") }}</td>
    <td><button class="x" hx-delete="/{{ token }}/sources/{{ s.name }}" hx-target="body" hx-swap="outerHTML">×</button></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
