<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skillkit</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sortable.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <a href="/{{ token }}/projects">Projects</a>
    <a href="/{{ token }}/sources">Sources</a>
    <a href="/{{ token }}/skills">Skills</a>
    <a href="/{{ token }}/profiles">Profiles</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <div id="modal-mount"></div>
  <script>
    // 局部 swap 后幂等重初始化 Sortable（data-sortable 标记防重复）
    document.body.addEventListener('htmx:afterSettle', () => {
      document.querySelectorAll('.sortable:not([data-sortable])').forEach((el) => {
        el.setAttribute('data-sortable', '1');
        new Sortable(el, { animation: 150 });
      });
    });
    // SSE：CLI 在另一进程改了 ~/.skillkit/ 时刷新当前页 main。
    // 请求 ?fragment=1 拿纯 main 内容（服务端渲染，不含 nav），innerHTML 替换。
    // 响应是片段而非完整页，从根上杜绝「nav 被塞进 main」的导航重复。
    var es = new EventSource('/{{ token }}/events');
    es.addEventListener('changed', function () {
      // scan 浮层开时跳过整页刷新（注册写 toml 触发 SSE，刷 main 会清浮层，破坏连续注册）
      if (document.querySelector('.scan-flyout')) return;
      // 稍延迟：写操作先写状态文件触发 SSE，后渲染完整页返回。直接刷新会与 POST 响应竞态，
      // 把刚渲染的 summary 反馈冲掉。延迟到完整页落地后再检查跳过。
      setTimeout(function () {
        // 写操作刚返回的 summary 反馈在展示时跳过刷新（片段刷新会冲掉它，用户还没看到反馈）
        if (document.querySelector('.page-head .summary')) return;
        // 保留当前 query（Skills 页 selected/profiles），只追加/覆盖 fragment=1
        var params = new URLSearchParams(location.search);
        params.set('fragment', '1');
        htmx.ajax('GET', location.pathname + '?' + params.toString(), {
          target: 'main', swap: 'innerHTML'
        });
      }, 300);
    });

    // ===== 目录浏览浮层关闭：✕ / 点遮罩 / ESC（纯 UI 收起，不涉业务） =====
    function closeBrowseOverlay(overlay) {
      var isScan = overlay.classList.contains('scan-flyout');
      overlay.remove();
      if (isScan) {
        // scan 浮层关闭：刷新 main 同步已注册列表（浮层开期间 SSE 被跳过）
        htmx.ajax('GET', location.pathname + '?fragment=1', { target: 'main', swap: 'innerHTML' });
      }
    }
    document.body.addEventListener('click', function (e) {
      var overlay = e.target.closest('.browse-overlay');
      if (!overlay) return;
      if (e.target.closest('.browse-close') || e.target === overlay) {
        e.preventDefault();
        closeBrowseOverlay(overlay);
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.browse-overlay').forEach(closeBrowseOverlay);
      }
    });
    // scan 候选 toggle：靠 toggle 端点 hx-swap=outerHTML 替换按钮片段，无需 JS 标记

    // ===== 路径输入框 Tab 补全 =====
    var SK_TOKEN = '{{ token }}';
    function moveCompleteActive(items, dir) {
      if (!items.length) return;
      var arr = Array.prototype.slice.call(items);
      var idx = arr.findIndex(function (i) { return i.classList.contains('active'); });
      if (idx < 0) idx = 0;
      arr[idx].classList.remove('active');
      idx = (idx + dir + arr.length) % arr.length;
      arr[idx].classList.add('active');
      arr[idx].scrollIntoView({ block: 'nearest' });
    }
    function setupComplete(input, panelId) {
      var panel = document.getElementById(panelId);
      if (!panel) return;
      input.addEventListener('keydown', function (e) {
        var items = panel.querySelectorAll('.complete-item');
        if (e.key === 'Tab') {
          e.preventDefault();
          var val = encodeURIComponent(input.value);
          htmx.ajax('GET', '/' + SK_TOKEN + '/projects/complete?path=' + val + '&panel=' + panelId,
                    { target: panel, swap: 'innerHTML' });
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          moveCompleteActive(items, 1);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          moveCompleteActive(items, -1);
        } else if (e.key === 'Enter') {
          var active = panel.querySelector('.complete-item.active');
          if (active) { e.preventDefault(); input.value = active.dataset.path; panel.innerHTML = ''; }
        } else if (e.key === 'Escape') {
          panel.innerHTML = '';
        }
      });
      panel.addEventListener('htmx:afterSettle', function () {
        var first = panel.querySelector('.complete-item');
        if (first) first.classList.add('active');
      });
      input.addEventListener('blur', function () {
        setTimeout(function () { panel.innerHTML = ''; }, 150);
      });
      panel.addEventListener('mousedown', function (e) {
        var item = e.target.closest('.complete-item');
        if (item) { input.value = item.dataset.path; panel.innerHTML = ''; }
      });
    }
    // SSE 刷新 main 后幂等重绑（data-complete-bound 防重复，仿 Sortable）
    document.body.addEventListener('htmx:afterSettle', function () {
      document.querySelectorAll('input[data-complete]:not([data-complete-bound])').forEach(function (input) {
        input.setAttribute('data-complete-bound', '1');
        setupComplete(input, input.dataset.complete);
      });
    });

    // ===== Skills 视图：高亮 toggle + 批量归入（选中态写回 URL，SSE/过滤 chip 透传） =====
    function selectedSkillIds() {
      return Array.prototype.slice
        .call(document.querySelectorAll('#skills tr.selected[data-id]'))
        .map(function (tr) { return tr.dataset.id; });
    }
    // 选中态写回地址栏（CSV ?selected=a,b），replaceState 不触发刷新
    function syncSelectedUrl() {
      var params = new URLSearchParams(location.search);
      params.set('selected', selectedSkillIds().join(','));
      history.replaceState(null, '', location.pathname + '?' + params.toString());
    }
    function refreshSkillBatch() {
      var ids = selectedSkillIds();
      document.querySelectorAll('.batch-bar').forEach(function (el) {
        el.style.display = ids.length ? '' : 'none';
      });
      var cnt = document.getElementById('skill-batch-count');
      if (cnt) cnt.textContent = ids.length;
      ['skill-batch', 'skill-batch-new'].forEach(function (fid) {
        var form = document.getElementById(fid);
        if (!form) return;
        Array.prototype.slice.call(form.querySelectorAll('input[name=id]')).forEach(function (e) { e.remove(); });
        ids.forEach(function (id) {
          var i = document.createElement('input');
          i.type = 'hidden'; i.name = 'id'; i.value = id;
          form.appendChild(i);
        });
      });
    }
    function toggleSkill(e, tr) {
      // 忽略按钮点击（→global/→local/upgrade/× 不触发行 toggle）
      if (e.target.tagName === 'BUTTON') return;
      tr.classList.toggle('selected');
      syncSelectedUrl();
      refreshSkillBatch();
    }
    document.body.addEventListener('htmx:afterSettle', refreshSkillBatch);

    // ===== 过滤条件进 URL（URL 是过滤状态唯一事实源） =====
    // 写操作返回页的过滤还原依赖服务端读 HX-Current-URL（地址栏），所以 chip 点击必须先把它写进地址栏。
    // 注意：在 configRequest（swap 前）做——afterRequest 时 chip 已被 innerHTML 替换出 DOM，
    // 事件不再冒泡到 body，body 级监听收不到。
    document.body.addEventListener('htmx:configRequest', function (e) {
      var chip = e.target.closest && e.target.closest('#skill-scope-filter .chip, #skill-profile-filter .chip');
      if (!chip) return;
      var selected = selectedSkillIds().join(','); // 以 DOM 实时选中为准（chip URL 是渲染时快照）
      e.detail.parameters.set('selected', selected);
      // 过滤参数取自 chip 的 hx-get URL（去掉 fragment=1），与请求实际携带一致
      var params = new URLSearchParams(chip.getAttribute('hx-get').split('?')[1] || '');
      params.delete('fragment');
      if (selected) params.set('selected', selected);
      var qs = params.toString();
      history.pushState(null, '', location.pathname + (qs ? '?' + qs : ''));
    });
    // 后退/前进：按地址栏过滤状态片段刷新 main（pushState 记录间移动）
    window.addEventListener('popstate', function () {
      var params = new URLSearchParams(location.search);
      params.set('fragment', '1');
      htmx.ajax('GET', location.pathname + '?' + params.toString(), {
        target: 'main', swap: 'innerHTML'
      });
    });

    // ===== 写操作错误 toast（4xx 响应不刷页，弹提示框）=====
    function showToast(msg) {
      var t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.className = 'toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4500);
    }
    // ===== 写操作成功 summary 反馈：短暂显示后淡出，避免常驻挡住 SSE 同步 =====
    // 完整页（写操作返回）渲染 summary 后自动隐藏；SSE 刷新在 summary 展示期跳过（见 es 监听），
    // 隐藏后恢复实时同步。对齐 toast 的反馈生命周期。
    document.body.addEventListener('htmx:afterSettle', function () {
      var summary = document.querySelector('.page-head .summary');
      if (!summary || summary.classList.contains('summary-auto-hide')) return;
      summary.classList.add('summary-auto-hide');
      setTimeout(function () {
        summary.style.transition = 'opacity .5s';
        summary.style.opacity = '0';
        setTimeout(function () { summary.remove(); }, 600);
      }, 4000);
    });
    document.body.addEventListener('htmx:afterRequest', function (e) {
      var xhr = e.detail && e.detail.xhr;
      if (xhr && xhr.status >= 400) {
        var msg = '操作失败';
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
        showToast(msg);
      }
    });

    // ===== install-local modal 交互（拖放/选择/互斥/提交路由） =====
    function installLocalSetup(modal) {
      var form = modal.querySelector('#install-form');
      if (!form || form.dataset.ready) return;
      form.dataset.ready = '1';
      var dz = form.querySelector('#install-drop-zone');
      var archiveInput = form.querySelector('input[name="archive"]');
      var fileInput = form.querySelector('input[name="file"]');
      var pathInput = form.querySelector('input[name="path"]');
      function clearCard() { var c = dz.querySelector('.file-card'); if (c) c.remove(); }
      function showCard(name, size) {
        clearCard();
        var c = document.createElement('div');
        c.className = 'file-card';
        c.innerHTML = name + (size ? ' · ' + size : '') + ' <button type="button">×</button>';
        c.querySelector('button').addEventListener('click', function () { resetSource(); });
        dz.querySelector('.drop-actions').before(c);
      }
      function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
      function resetSource() {
        archiveInput.value = ''; fileInput.value = ''; pathInput.value = '';
        dz.classList.remove('has-file'); clearCard();
      }
      function setArchive() {
        fileInput.value = ''; pathInput.value = '';
        dz.classList.add('has-file');
        if (archiveInput.files[0]) showCard(archiveInput.files[0].name, fmtSize(archiveInput.files[0].size));
      }
      function setDir() {
        archiveInput.value = ''; pathInput.value = '';
        dz.classList.add('has-file');
        if (fileInput.files.length) {
          var rel = fileInput.files[0].webkitRelativePath || fileInput.files[0].name;
          var top = rel.split('/')[0];
          showCard(top + '/（' + fileInput.files.length + ' 个文件）', '');
        }
      }
      dz.querySelectorAll('[data-pick]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          (btn.dataset.pick === 'archive' ? archiveInput : fileInput).click();
        });
      });
      archiveInput.addEventListener('change', function () { if (archiveInput.files[0]) setArchive(); });
      fileInput.addEventListener('change', function () { if (fileInput.files.length) setDir(); });
      pathInput.addEventListener('input', function () {
        if (pathInput.value.trim()) { archiveInput.value = ''; fileInput.value = ''; dz.classList.remove('has-file'); clearCard(); }
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        dz.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); dz.classList.add('drag'); });
      });
      ['dragleave', 'dragend'].forEach(function (ev) {
        dz.addEventListener(ev, function () { dz.classList.remove('drag'); });
      });
      dz.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation(); dz.classList.remove('drag');
        var files = e.dataTransfer.files;
        if (!files || !files.length) return;
        var dt = new DataTransfer();
        for (var i = 0; i < files.length; i++) dt.items.add(files[i]);
        var first = files[0];
        var rel = first.webkitRelativePath || '';
        if (rel.indexOf('/') >= 0 || files.length > 1) {
          fileInput.files = dt.files; setDir();
        } else {
          archiveInput.files = dt.files; setArchive();
        }
      });
    }

    function installLocalSubmit(e) {
      e.preventDefault();
      var form = e.target;
      var token = form.dataset.token || '';
      var archiveInput = form.querySelector('input[name="archive"]');
      var fileInput = form.querySelector('input[name="file"]');
      var pathInput = form.querySelector('input[name="path"]');
      var nameVal = form.querySelector('input[name="name"]').value.trim();
      var scopeVal = form.querySelector('select[name="scope"]').value;
      var forceVal = form.querySelector('input[name="force"]').checked;
      var hasZip = archiveInput.files && archiveInput.files[0];
      var hasDir = fileInput.files && fileInput.files.length;
      var path = pathInput.value.trim();
      var url, body;
      if (hasZip || hasDir) {
        url = '/' + token + '/skills/install-local/upload';
        var fd = new FormData();
        if (nameVal) fd.append('name', nameVal);
        fd.append('scope', scopeVal);
        if (forceVal) fd.append('force', 'on');
        if (hasZip) {
          fd.append('archive', archiveInput.files[0], archiveInput.files[0].name);
        } else {
          for (var i = 0; i < fileInput.files.length; i++) {
            var f = fileInput.files[i];
            fd.append('file', f, f.webkitRelativePath || f.name);
          }
        }
        body = fd;
      } else if (path) {
        url = '/' + token + '/skills/install-local';
        var params = new URLSearchParams();
        if (nameVal) params.append('name', nameVal);
        params.append('scope', scopeVal);
        if (forceVal) params.append('force', 'on');
        params.append('path', path);
        body = params;
      } else {
        showToast('请拖放/选择文件，或输入路径');
        return false;
      }
      var btn = form.querySelector('.install-actions .primary');
      btn.disabled = true;
      var orig = btn.textContent;
      btn.textContent = '安装中…';
      fetch(url, { method: 'POST', body: body, headers: { 'HX-Request': 'true', 'HX-Current-URL': location.href } })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || '安装失败'); });
          return r.text();
        })
        .then(function (html) {
          document.open(); document.write(html); document.close();
        })
        .catch(function (err) {
          btn.disabled = false; btn.textContent = orig;
          showToast(err.message || '安装失败，请重试');
        });
      return false;
    }

    // modal 注入 #modal-mount 后初始化交互
    document.body.addEventListener('htmx:afterSwap', function () {
      var m = document.querySelector('.browse-modal.install-modal');
      if (m) installLocalSetup(m);
    });
  </script>
</body>
</html>
