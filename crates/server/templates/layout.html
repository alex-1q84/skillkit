<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skillkit</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sortable.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <a href="/{{ token }}/projects">Projects</a>
    <a href="/{{ token }}/sources">Sources</a>
    <a href="/{{ token }}/skills">Skills</a>
    <a href="/{{ token }}/profiles">Profiles</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>
    // 局部 swap 后幂等重初始化 Sortable（data-sortable 标记防重复）
    document.body.addEventListener('htmx:afterSettle', () => {
      document.querySelectorAll('.sortable:not([data-sortable])').forEach((el) => {
        el.setAttribute('data-sortable', '1');
        new Sortable(el, { animation: 150 });
      });
    });
    // SSE：CLI 在另一进程改了 ~/.skillkit/ 时，浏览器当前页 main 自动刷新。
    // select: 'main' 让 htmx 只提取响应的 main 元素，避免完整页面的 nav 被塞进 main 造成导航重复。
    var es = new EventSource('/{{ token }}/events');
    es.addEventListener('changed', function () {
      htmx.ajax('GET', location.pathname, { target: 'main', swap: 'outerHTML', select: 'main' });
    });
  </script>
</body>
</html>
