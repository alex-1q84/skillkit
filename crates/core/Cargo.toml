[package]
name = "skillkit-core"
version = "0.1.4"
edition = "2021"
description = "Core library of skillkit: unified management for AI agent skills (sources, registry, profiles, project apply)"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
dirs = "5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fs2 = "0.4"
zip = "2"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
