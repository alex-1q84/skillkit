[package]
name = "skillkit-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skillkit"
path = "src/main.rs"

[dependencies]
skillkit-core = { path = "../core" }
skillkit-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints]
workspace = true
