[package]
name = "skillkit-cli"
version = "0.1.4"
edition = "2021"
description = "CLI of skillkit: install, organize and apply AI agent skills across projects and agents"
license.workspace = true
repository.workspace = true

[[bin]]
name = "skillkit"
path = "src/main.rs"

[dependencies]
skillkit-core = { path = "../core" }
skillkit-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
